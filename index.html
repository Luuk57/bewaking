<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bewakingscamera PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #121212;
      color: #fff;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { 
      font-size: 1.4rem; 
      margin-top: 0;
      margin-bottom: 16px; 
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 480px;
    }
    select, button {
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9rem;
    }
    select {
      background: #2a2a2a;
      color: white;
      border: 1px solid #444;
      flex: 1 1 100%;
    }
    button {
      cursor: pointer;
      background: #007bff;
      color: white;
      flex: 1;
    }
    button:disabled { 
      background: #444; 
      color: #888;
      cursor: not-allowed; 
    }
    .btn-danger { background: #dc3545; }
    .btn-dark { background: #333; border: 1px solid #555; }
    
    .video-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    video { 
      width: 100%; 
      display: block; 
    }
    .status {
      margin: 14px 0;
      font-size: 0.9rem;
      color: #aaa;
      text-align: center;
      min-height: 2.7em;
    }
    .gallery {
      width: 100%;
      max-width: 480px;
      margin-top: 10px;
    }
    .gallery h2 { 
      font-size: 1.1rem; 
      border-bottom: 1px solid #333; 
      padding-bottom: 8px; 
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 8px;
    }
    .grid img {
      width: 100%;
      height: 70px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #444;
    }
    /* Dim-scherm overlay */
    #dimOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.96);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      color: #555;
      font-size: 1.1rem;
      user-select: none;
    }
  </style>
</head>
<body>

  <h1>Bewakingscamera PWA</h1>

  <div class="controls">
    <select id="cameraSelect">
      <option value="environment">Achtercamera (Back)</option>
      <option value="user">Voorcamera (Front)</option>
    </select>
    <button id="btnStart">Start Camera</button>
    <button id="btnStop" class="btn-danger" disabled>Stop</button>
    <button id="btnDim" class="btn-dark" disabled>Dim Scherm</button>
  </div>

  <div class="video-container">
    <video id="video" autoplay playsinline muted></video>
  </div>

  <div id="status" class="status">Status: Gestopt</div>

  <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>

  <div class="gallery">
    <h2>Gemaakte Foto's (<span id="photoCount">0</span>)</h2>
    <div id="grid" class="grid"></div>
  </div>

  <div id="dimOverlay">Tik op het scherm om te ontgrendelen</div>

  <script>
    // Jouw Google Apps Script URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbymGiqPKPzHrOTfrvS5WrzkwZhAUqHVksVjQdHv4aV0qGXJq2WGS3S-PBgUOnwS2n8t/exec";

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const cameraSelect = document.getElementById('cameraSelect');
    const btnStart = document.getElementById('btnStart');
    const btnStop = document.getElementById('btnStop');
    const btnDim = document.getElementById('btnDim');
    const statusEl = document.getElementById('status');
    const grid = document.getElementById('grid');
    const photoCount = document.getElementById('photoCount');
    const dimOverlay = document.getElementById('dimOverlay');

    let stream = null;
    let intervalId = null;
    let previousFrame = null;
    let wakeLock = null;
    let count = 0;
    let lastPhotoTime = 0;

    // 1. Wake Lock activeren om scherm aan te houden
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.warn("Wake Lock mislukt:", err);
      }
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release();
        wakeLock = null;
      }
    }

    // 2. Camera starten
    btnStart.addEventListener('click', async () => {
      const selectedCamera = cameraSelect.value;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: selectedCamera } 
        });
        video.srcObject = stream;
        btnStart.disabled = true;
        cameraSelect.disabled = true;
        btnStop.disabled = false;
        btnDim.disabled = false;
        statusEl.innerText = "Status: Actief - Zoeken naar beweging...";
        
        await requestWakeLock();
        intervalId = setInterval(detectMotion, 200); // 5x per seconde
      } catch (err) {
        statusEl.innerText = "Fout bij openen camera: " + err.message;
      }
    });

    // 3. Camera stoppen
    btnStop.addEventListener('click', () => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      clearInterval(intervalId);
      releaseWakeLock();
      btnStart.disabled = false;
      cameraSelect.disabled = false;
      btnStop.disabled = true;
      btnDim.disabled = true;
      statusEl.innerText = "Status: Gestopt";
      previousFrame = null;
    });

    // 4. Bewegingsdetectie via pixelverschil
    function detectMotion() {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const currentFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);

      if (previousFrame) {
        let diff = 0;
        const data1 = currentFrame.data;
        const data2 = previousFrame.data;

        for (let i = 0; i < data1.length; i += 4) {
          const rDiff = Math.abs(data1[i] - data2[i]);
          const gDiff = Math.abs(data1[i+1] - data2[i+1]);
          const bDiff = Math.abs(data1[i+2] - data2[i+2]);
          if (rDiff + gDiff + bDiff > 90) diff++;
        }

        // Minimaal 3 seconden pauze tussen foto's
        const now = Date.now();
        if (diff > 4000 && (now - lastPhotoTime > 3000)) {
          lastPhotoTime = now;
          capturePhoto();
        }
      }
      previousFrame = currentFrame;
    }

    // 5. Foto maken en verzenden naar Google Drive/Sheet
    function capturePhoto() {
      const dataUrl = canvas.toDataURL('image/jpeg');
      
      const now = new Date();
      const timestamp = now.getFullYear() + "-" +
        String(now.getMonth() + 1).padStart(2, '0') + "-" +
        String(now.getDate()).padStart(2, '0') + "_" +
        String(now.getHours()).padStart(2, '0') + "-" +
        String(now.getMinutes()).padStart(2, '0') + "-" +
        String(now.getSeconds()).padStart(2, '0');
      
      const fileName = `bewaking_${timestamp}.jpg`;

      // Toon in lokale galerij
      const img = document.createElement('img');
      img.src = dataUrl;
      img.title = fileName;
      grid.prepend(img);
      count++;
      photoCount.innerText = count;

      statusEl.innerText = "Status: Foto uploaden naar Google Drive...";

      // Verzenden naar Google Apps Script
      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          image: dataUrl,
          filename: fileName
        })
      })
      .then(() => {
        statusEl.innerText = "Status: Foto opgeslagen in Drive & Sheet! (" + new Date().toLocaleTimeString() + ")";
      })
      .catch(err => {
        statusEl.innerText = "Fout bij uploaden: " + err.message;
      });
    }

    // 6. Dim-modus
    btnDim.addEventListener('click', () => { dimOverlay.style.display = 'flex'; });
    dimOverlay.addEventListener('click', () => { dimOverlay.style.display = 'none'; });

    // Service Worker registreren
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
