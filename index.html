<!-- Voeg een cameraschakelaar toe aan de controls -->
<div class="controls">
  <select id="cameraSelect">
    <option value="environment">Achtercamera (Back)</option>
    <option value="user">Voorcamera (Front)</option>
  </select>
  <button id="btnStart">Start Camera</button>
  <button id="btnStop" class="btn-danger" disabled>Stop</button>
  <button id="btnDim" class="btn-dark" disabled>Dim Scherm</button>
</div>

<script>
  const cameraSelect = document.getElementById('cameraSelect');

  btnStart.addEventListener('click', async () => {
    const selectedCamera = cameraSelect.value;
    try {
      // Gebruik de gekozen camera (user of environment)
      stream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: selectedCamera } 
      });
      video.srcObject = stream;
      // ... overige start logica ...
    } catch (err) {
      statusEl.innerText = "Fout bij openen camera: " + err.message;
    }
  });

  // Foto maken met datum/tijd als bestandsnaam
  function capturePhoto() {
    const dataUrl = canvas.toDataURL('image/jpeg');
    
    // Genereer datum/tijd stempel (bijv: 2026-11-03_15-43-00)
    const now = new Date();
    const timestamp = now.getFullYear() + "-" +
      String(now.getMonth() + 1).padStart(2, '0') + "-" +
      String(now.getDate()).padStart(2, '0') + "_" +
      String(now.getHours()).padStart(2, '0') + "-" +
      String(now.getMinutes()).padStart(2, '0') + "-" +
      String(now.getSeconds()).padStart(2, '0');
    
    const fileName = `bewaking_${timestamp}.jpg`;

    // Toon in de galerij
    const img = document.createElement('img');
    img.src = dataUrl;
    img.title = fileName;
    grid.prepend(img);

    // Hier kun je de Google Drive Upload functie aanroepen met dataUrl en fileName
  }
</script>
